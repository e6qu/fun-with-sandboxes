name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: cross-build
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: vet (darwin)
        run: |
          GOOS=darwin GOARCH=arm64 scripts/vet.sh
          GOOS=darwin GOARCH=amd64 scripts/vet.sh
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 go vet -tags e2e ./...)
      - name: portable unit tests
        run: go test -race -count=3 ./...
      - name: third_party/buildkit matches its sync script
        run: |
          scripts/sync-buildkit.sh
          git diff --exit-code -- third_party/buildkit
          test -z "$(git status --porcelain -- third_party/buildkit)"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each test runs three times under the race detector, so a test that
      # passes only sometimes, or races, fails here.
      - name: unit tests
        run: go test -race -count=3 ./...

  e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@v31
      - name: install the Docker CLI, Docker Compose and buildx
        run: |
          brew install docker docker-compose docker-buildx
          mkdir -p ~/.docker
          echo "{\"cliPluginsExtraDirs\": [\"$(brew --prefix)/lib/docker/cli-plugins\"]}" > ~/.docker/config.json
          docker buildx version
      - name: build images
        run: scripts/build-images.sh "$RUNNER_TEMP/images"
      - name: publish images to a local registry
        run: |
          crane="go run github.com/google/go-containerregistry/cmd/crane@v0.22.1"
          $crane registry serve --address 127.0.0.1:5000 &
          until curl -sf 127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done
          scripts/publish-images.sh "$RUNNER_TEMP/images" 127.0.0.1:5000/e6qu
          for ref in fws-postgres:16 fws-redis:7 fws-nginx:1 fws-mariadb:11 fws-toolbox:1 fws-ryuk:0.14.0; do
            $crane config "127.0.0.1:5000/e6qu/$ref" | grep -q '"os":"darwin"'
          done
      - name: end-to-end tests
        env:
          FWS_E2E_IMAGES: ${{ runner.temp }}/images
        working-directory: tests/e2e
        run: go test -tags e2e -v -count=1 -timeout 30m ./...
