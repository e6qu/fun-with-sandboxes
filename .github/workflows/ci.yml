name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch by hand when GitHub drops a pull request's event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: cross-build
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: vet (darwin)
        run: |
          GOOS=darwin GOARCH=arm64 scripts/vet.sh
          GOOS=darwin GOARCH=amd64 scripts/vet.sh
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 go vet -tags e2e ./...)
      - name: portable unit tests
        run: go test -race -count=3 ./...
      - name: third_party/buildkit matches its sync script
        run: |
          scripts/sync-buildkit.sh
          git diff --exit-code -- third_party/buildkit
          test -z "$(git status --porcelain -- third_party/buildkit)"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each test runs three times under the race detector, so a test that
      # passes only sometimes, or races, fails here.
      - name: unit tests
        run: go test -race -count=3 ./...
      # What a container's processes pay for each system call the path
      # library interposes, beside the same call made natively.
      - name: system calls through the path library
        run: go test -run '^$' -bench . ./internal/pathmap
      # How long a container's main process takes to start, part by part.
      - name: container start
        run: go test -run '^$' -bench . -benchtime 20x ./internal/runtime
      # How long Seatbelt takes to compile a container's profile, which each
      # of its processes pays.
      - name: profile compile
        run: go test -run '^$' -bench . -benchtime 50x ./internal/seatbelt

  # Nix builds MySQL and MariaDB from source, with their vendors'
  # compilation comment (images/servers.nix), which no binary cache holds.
  # Each server's build is kept in the Actions cache, keyed by its
  # derivation, so it is built again only when it changes.
  servers:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        server: [mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A sandboxed build, as Hydra's: MySQL's CMake otherwise takes
      # OpenSSL from the runner's Homebrew.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            sandbox = true
      - name: derivation
        id: drv
        run: echo "key=server-${{ matrix.server }}-$(scripts/build-images.sh --server-derivations ${{ matrix.server }} | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/fws-servers/${{ matrix.server }}
          key: ${{ steps.drv.outputs.key }}
          lookup-only: true
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          paths=$(scripts/build-images.sh --servers ${{ matrix.server }})
          nix --extra-experimental-features nix-command copy --to "file://$HOME/fws-servers/${{ matrix.server }}" $paths
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/fws-servers/${{ matrix.server }}
          key: ${{ steps.drv.outputs.key }}

  # The catalog's image archives, kept in the Actions cache under a hash of
  # every file their build reads (scripts/build-images.sh --inputs). A
  # macOS runner takes from twenty minutes to an hour to build them, so a
  # run builds them only when one of those files changes.
  images:
    needs: servers
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the archives' inputs
        id: key
        run: |
          scripts/build-images.sh --inputs > "$RUNNER_TEMP/inputs"
          echo "key=images-$(xargs shasum -a 256 < "$RUNNER_TEMP/inputs" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: images
        with:
          path: ~/fws-images
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: cachix/install-nix-action@v31
        if: steps.images.outputs.cache-hit != 'true'
        with:
          extra_nix_config: trusted-users = root runner
      - name: database server derivations
        if: steps.images.outputs.cache-hit != 'true'
        id: drv
        run: |
          for s in mysql mariadb; do
            echo "$s=server-$s-$(scripts/build-images.sh --server-derivations $s | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/cache/restore@v4
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: ~/fws-servers/mysql
          key: ${{ steps.drv.outputs.mysql }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: ~/fws-servers/mariadb
          key: ${{ steps.drv.outputs.mariadb }}
          fail-on-cache-miss: true
      # The images, their archives and a registry's copies fill the
      # runner's disk; the runner's SDKs for other platforms take tens of
      # gigabytes the build never uses.
      - name: free disk space
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/.ghcup /usr/local/lib/android \
            /Library/Developer/CoreSimulator/Caches ~/Library/Developer/CoreSimulator/Caches
          xcrun simctl delete all || true
          df -h /
      # What the image build makes rather than substitutes from
      # cache.nixos.org: the files the images pin from GitHub releases and
      # repositories, and the packages Hydra does not build, such as Consul
      # and MongoDB under their licences. Nix substitutes by store path, so
      # an earlier run's cache serves every derivation that has not changed.
      - uses: actions/cache/restore@v4
        if: steps.images.outputs.cache-hit != 'true'
        id: built
        with:
          path: ~/fws-built
          key: built-${{ hashFiles('scripts/build-images.sh', 'images/**') }}
          restore-keys: built-
      - name: build images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          substituters="file://$HOME/fws-servers/mysql?trusted=1 file://$HOME/fws-servers/mariadb?trusted=1"
          # The daemon, as root, would claim an empty cache directory that
          # the next step fills as the runner.
          if [ -d ~/fws-built ]; then
            substituters="$substituters file://$HOME/fws-built?trusted=1"
          fi
          export NIX_CONFIG="extra-substituters = $substituters"
          scripts/build-images.sh ~/fws-images
      # The store paths this run built, added to what the restored cache
      # holds.
      - name: keep what the build made
        if: steps.images.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true'
        run: |
          built=$(nix --extra-experimental-features nix-command path-info --json --all | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          entries = d.items() if isinstance(d, dict) else ((e["path"], e) for e in d)
          print(" ".join(p for p, i in entries if i and i.get("ultimate")))')
          mkdir -p ~/fws-built
          if [ -n "$built" ]; then
            nix --extra-experimental-features nix-command copy --to "file://$HOME/fws-built" $built
          fi
          du -sh ~/fws-built
      - uses: actions/cache/save@v4
        if: steps.images.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true'
        with:
          path: ~/fws-built
          key: ${{ steps.built.outputs.cache-primary-key }}
      - name: free what the build left
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/fws-built ~/fws-servers
          nix-store --gc
          df -h /
      # crane's registry keeps every blob in memory, so it stops once it
      # has shown the archives publish.
      - name: publish images to a local registry
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          crane="$RUNNER_TEMP/bin/crane"
          "$crane" registry serve --address 127.0.0.1:5000 &
          registry=$!
          trap 'kill $registry' EXIT
          until curl -sf 127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done
          scripts/publish-images.sh ~/fws-images 127.0.0.1:5000/e6qu
          for ref in fws-postgres:16 fws-postgres:18 fws-redis:8 fws-nginx:1 fws-mariadb:11 fws-python:3.14 fws-node:26 fws-bun:1 fws-gitea:1 fws-dynamodb-local:2 fws-rabbitmq:4 fws-lambda/python:3.14 fws-lambda/nodejs:24 fws-lambda/java:17 fws-playwright:1.59 fws-toolbox:1 fws-ryuk:0.14.0 fws-mysql:8.4 fws-valkey:9 fws-memcached:1.6 fws-nats:2.14 fws-seaweedfs:4.36 fws-etcd:3.6 fws-consul:2.1 fws-vault:2.0 fws-mongo:8.2 fws-kafka:4.2 fws-mailpit:1.32 fws-meilisearch:1.43 fws-qdrant:1.17 fws-neo4j:2026.02 fws-clickhouse:26.5 fws-influxdb:2.7 fws-opensearch:3.5 fws-toxiproxy:2.12 fws-dind:29 fws-kube-apiserver:1.35 fws-kube-controller-manager:1.35 fws-kube-scheduler:1.35 fws-kubectl:1.35 fws-pause:3.10.1 fws-kubelet:1.35; do
            "$crane" config "127.0.0.1:5000/e6qu/$ref" | grep -q '"os":"darwin"'
          done
      - uses: actions/cache/save@v4
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: ~/fws-images
          key: ${{ steps.key.outputs.key }}

  e2e:
    needs: images
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v4
        with:
          path: ~/fws-images
          key: ${{ needs.images.outputs.key }}
          fail-on-cache-miss: true
      - name: install the Docker CLI, Docker Compose and buildx
        run: |
          brew install docker docker-compose docker-buildx podman podman-compose cri-tools
          mkdir -p ~/.docker
          echo "{\"cliPluginsExtraDirs\": [\"$(brew --prefix)/lib/docker/cli-plugins\"]}" > ~/.docker/config.json
          docker buildx version
      # A runner that dies takes its job's log with it. The suite runs in
      # the background, and each snapshot keeps its output so far and the
      # runner's memory, disk and busiest processes as an artifact.
      - name: start the end-to-end tests
        working-directory: tests/e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          export FWS_E2E_IMAGES=~/fws-images
          nohup sh -c 'go test -tags e2e -v -count=1 -timeout 90m ./...; echo $? > "$RUNNER_TEMP/e2e/exit"' \
            > "$RUNNER_TEMP/e2e/test.log" 2>&1 < /dev/null &
          nohup sh -c 'while [ ! -e "$RUNNER_TEMP/e2e/exit" ]; do
              date; df -h /; sysctl vm.swapusage kern.memorystatus_level; vm_stat
              ps -o pid,ppid,pgid,stat,rss,%cpu,etime,comm -p "$(pgrep -d, -f "Runner\.|provjobd")"
              ps -axro pid,ppid,pgid,stat,rss,%cpu,etime,comm | head -25; sleep 15
            done' > "$RUNNER_TEMP/e2e/samples.log" 2>&1 < /dev/null &
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-01
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-02
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-03
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-04
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-05
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-06
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-07
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-08
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-09
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-10
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-11
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-12
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-13
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-14
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-15
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-16
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-17
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-18
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-19
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-20
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-21
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-22
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-23
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-24
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-25
      - name: end-to-end tests
        run: |
          cat "$RUNNER_TEMP/e2e/test.log"
          [ -e "$RUNNER_TEMP/e2e/exit" ] || { echo "the suite is still running"; exit 1; }
          exit "$(cat "$RUNNER_TEMP/e2e/exit")"
      - name: crash reports and Seatbelt denials
        if: failure()
        run: |
          df -h /
          vm_stat
          # Each crash report's reason, where an uncaught exception was
          # thrown, the faulting thread and every distinct thread stack.
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import collections, json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          r = json.loads(body)
          def frames(fs):
              return [x.get("symbol", "?") for x in fs]
          print(json.dumps({k: r.get(k) for k in ("procPath", "parentProc", "exception", "asi", "termination")}))
          if "lastExceptionBacktrace" in r:
              print("thrown at:")
              for s in frames(r["lastExceptionBacktrace"])[:30]:
                  print("   ", s)
          threads = r.get("threads", [])
          ft = r.get("faultingThread")
          if ft is not None and ft < len(threads):
              print("faulting thread", ft, ":")
              for s in frames(threads[ft].get("frames", []))[:30]:
                  print("   ", s)
          stacks = collections.Counter(" <- ".join(frames(t.get("frames", []))[:12]) for t in threads)
          print(len(threads), "threads")
          for s, n in stacks.most_common(15):
              print(n, s)
          PY
          done
          # Each distinct denial once, by process, from the suite's last
          # minutes: reading hours of the unified log starves the runner
          # until it loses its connection, and the job's log with it.
          perl -e 'alarm 120; exec @ARGV' log show --last 20m --style compact --predicate 'sender == "Sandbox"' |
            sed -n 's/.*Sandbox: \([^(]*\)([0-9]*) \(deny.*\)/\1 \2/p' | sort | uniq -c | sort -rn

  # The images main's tests passed, on GitHub's container registry as
  # ghcr.io/<owner>/fws-<name>:<tag>, which the engine pulls from.
  publish:
    needs: [images, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v4
        with:
          path: ~/fws-images
          key: ${{ needs.images.outputs.key }}
          fail-on-cache-miss: true
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$TOKEN" | "$RUNNER_TEMP/bin/crane" auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: publish images to ghcr.io
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          scripts/publish-images.sh ~/fws-images "ghcr.io/$owner"
