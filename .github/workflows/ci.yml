name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch by hand when GitHub drops a pull request's event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Off: Go's caches, near 1.4 GB, would crowd the catalog's out of
          # the repository's 10 GB, and Go builds the module in minutes.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: cross-build
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: vet (darwin)
        run: |
          GOOS=darwin GOARCH=arm64 scripts/vet.sh
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 go vet -tags e2e ./...)
      # libarchive's bsdtar, which images/tar fronts and its tests run.
      - name: bsdtar
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - name: portable unit tests
        run: go test -race -count=3 ./...
      # staticcheck for the build that ships; staticcheck.conf names the
      # checks left out and why.
      - name: staticcheck (darwin)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          mapfile -t pkgs < <(go list ./... | grep -v /third_party/)
          GOOS=darwin GOARCH=arm64 "$RUNNER_TEMP/bin/staticcheck" "${pkgs[@]}"
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 "$RUNNER_TEMP/bin/staticcheck" -tags e2e ./...)
      # ineffassign, nilness, exhaustive, ShellCheck and actionlint
      # (scripts/lint.sh); ShellCheck comes with the runner's image.
      - name: lint (darwin)
        run: GOOS=darwin GOARCH=arm64 GOBIN="$RUNNER_TEMP/bin" scripts/lint.sh
      # Known vulnerabilities in the code the engine and the suite call,
      # the standard library's included, for the build that ships.
      - name: govulncheck (darwin)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=darwin GOARCH=arm64 "$RUNNER_TEMP/bin/govulncheck" ./...
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 "$RUNNER_TEMP/bin/govulncheck" -tags e2e ./...)
      # The parsers of what builds, clients and other containers hand the
      # engine, each fuzzed for a while; a failing input is printed.
      - name: fuzz
        run: scripts/fuzz.sh 30s
      - name: the end-to-end shards hold every test once
        run: |
          for k in 1 2 3 4; do scripts/e2e-shard.sh 4 $k; done | sed 's/^\^(//; s/)\$$//' | tr '|' '\n' | sort > "$RUNNER_TEMP/sharded"
          grep -h '^func Test' tests/e2e/*_test.go | grep -v '^func TestMain(' | sed 's/^func \(Test[A-Za-z0-9_]*\).*/\1/' | sort > "$RUNNER_TEMP/tests"
          diff "$RUNNER_TEMP/tests" "$RUNNER_TEMP/sharded"
      - name: third_party/buildkit matches its sync script
        run: |
          scripts/sync-buildkit.sh
          git diff --exit-code -- third_party/buildkit
          test -z "$(git status --porcelain -- third_party/buildkit)"

  # The unit tests and probes on each macOS the engine runs on: it leans on
  # Seatbelt's compiled profiles, process responsibility and the loader,
  # which change with macOS releases.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Off: Go's caches, near 1.4 GB, would crowd the catalog's out of
          # the repository's 10 GB, and Go builds the module in minutes.
          cache: false
      # Each test runs three times under the race detector, so a test that
      # passes only sometimes, or races, fails here. internal/pathmap's
      # probes take seven minutes on a quick runner and twice that on a
      # slow one, past go test's default ten.
      - name: unit tests
        run: go test -race -count=3 -timeout 30m ./...
      # The probes again, with the container library and the spawn helper
      # built to trap where their C would act undefined: an out-of-bounds
      # index, a misaligned or null pointer, a signed overflow.
      - name: unit tests, C under UndefinedBehaviorSanitizer
        env:
          FWS_CFLAGS: -fsanitize=undefined -fsanitize-trap=undefined -g
        run: go test -count=1 ./internal/pathmap ./internal/runtime ./internal/shim ./internal/seatbelt
      # The container library and spawn helper under warnings beyond the
      # -Wall -Werror they build with, and clang's static analyzer over the
      # helper; neither changes what they compile to. The library's
      # interposed functions keep their originals' parameters, used or not,
      # and its analyzer reports its process-long buffers as leaks.
      - name: C warnings and static analysis
        working-directory: internal/pathmap/src
        run: |
          for f in fwsroot.c spawn.c; do
            xcrun clang -fsyntax-only -Wall -Wextra -Wno-unused-parameter -Wshadow -Wsign-compare -Werror "$f"
          done
          xcrun clang --analyze -Xclang -analyzer-werror -o /dev/null spawn.c
      # The path mapping's fuzzer (internal/pathmap/testdata/fuzz) for two
      # minutes, under AddressSanitizer and UndefinedBehaviorSanitizer, from
      # a seed it prints, which FWS_PATH_FUZZ_SEED replays.
      - name: path mapping fuzzer
        env:
          FWS_PATH_FUZZ_SECONDS: "120"
        run: go test -count=1 -v -run '^TestPathMappingFuzz$' ./internal/pathmap
      # What macOS lets an unprivileged process do with its children's
      # jetsam memory limits (TestJetsamLimitExperiment), printed even when
      # an earlier step failed.
      - name: jetsam experiment
        if: ${{ !cancelled() }}
        run: go test -v -count=1 -run TestJetsamLimitExperiment ./internal/runtime
      # Which resolver functions a connection Network.framework makes by
      # name calls (TestNetworkFrameworkExperiment), printed even when an
      # earlier step failed.
      - name: Network.framework experiment
        if: ${{ !cancelled() }}
        run: go test -v -count=1 -run TestNetworkFrameworkExperiment ./internal/pathmap
      # What a container's processes pay for each system call the path
      # library interposes, beside the same call made natively.
      - name: system calls through the path library
        run: go test -run '^$' -bench . ./internal/pathmap
      # How long a container's main process takes to start, part by part.
      - name: container start
        run: go test -run '^$' -bench . -benchtime 20x ./internal/runtime
      # How long Seatbelt takes to compile a container's profile, which each
      # of its processes pays.
      - name: profile compile
        run: go test -run '^$' -bench . -benchtime 50x ./internal/seatbelt

  # Nix builds from source what no binary cache holds: MySQL and MariaDB
  # with their vendors' compilation comment (images/servers.nix), and the
  # catalog's packages at the releases nixpkgs lacks (images/catalog), in
  # groups side by side (scripts/build-images.sh --prebuilt). Each group's
  # build is kept in the Actions cache, keyed by its derivations, so it is
  # built again only when they change, and handed to the images job as an
  # artifact of the run.
  prebuilt:
    runs-on: macos-15
    timeout-minutes: 150
    # actions: write lets it drop the cache entries its build supersedes.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        group: [mysql, mariadb, qdrant, meilisearch, influxdb, gitea, tools, kubernetes, consul]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A sandboxed build, as Hydra's: MySQL's CMake otherwise takes
      # OpenSSL from the runner's Homebrew.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            sandbox = true
      - name: derivation
        id: drv
        run: echo "key=prebuilt-${{ matrix.group }}-$(scripts/build-images.sh --prebuilt-derivations ${{ matrix.group }} | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The group's build, or else what an earlier run built of it: a run
      # cancelled or failed partway keeps what it finished (below), from
      # which the next substitutes.
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ~/fws-prebuilt/${{ matrix.group }}
          key: ${{ steps.drv.outputs.key }}
          restore-keys: |
            ${{ steps.drv.outputs.key }}-
            prebuilt-${{ matrix.group }}-
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/fws-prebuilt/${{ matrix.group }}"
          # The daemon, as root, would claim an empty cache directory that
          # this step fills as the runner.
          if [ -d "$dir" ]; then
            export NIX_CONFIG="extra-substituters = file://$dir?trusted=1"
          fi
          # A failed build fails the step here; macOS's bash 3.2 has no
          # mapfile.
          out=$(scripts/build-images.sh --prebuilt "${{ matrix.group }}")
          paths=()
          while read -r p; do [ -z "$p" ] || paths+=("$p"); done <<< "$out"
          # zstd, not the file store's default xz, which takes many minutes
          # over a group's closure; the cache compresses the store again.
          nix --extra-experimental-features nix-command copy --to "file://$dir?compression=zstd" "${paths[@]}"
      - uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/fws-prebuilt/${{ matrix.group }}
          key: ${{ steps.drv.outputs.key }}
      # The group's whole build supersedes its partial builds and its
      # builds of older derivations, which would otherwise crowd the
      # repository's 10 GB of cache until the other groups' entries are
      # evicted and rebuilt.
      - name: drop the entries this build supersedes
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "prebuilt-${{ matrix.group }}-" --limit 100 --json key --jq '.[].key' |
            sort -u | while read -r k; do
              if [ "$k" != "${{ steps.drv.outputs.key }}" ]; then
                gh cache delete --repo "$GITHUB_REPOSITORY" "$k" || true
              fi
            done
      # A build stopped partway, by a failure or a newer push, keeps the
      # store paths it finished, under a key the next run restores from
      # but does not take for the whole group.
      # A cancelled run's newer run waits for this one to end, so keeping
      # what it finished is bounded.
      - name: keep what a stopped build finished
        id: partial
        if: (failure() || cancelled()) && steps.cache.outputs.cache-hit != 'true' && steps.drv.outputs.key != ''
        timeout-minutes: 5
        run: |
          out=$(nix --extra-experimental-features nix-command path-info --json --all | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          entries = d.items() if isinstance(d, dict) else ((e["path"], e) for e in d)
          print("\n".join(p for p, i in entries if i and i.get("ultimate")))')
          built=()
          while read -r p; do [ -z "$p" ] || built+=("$p"); done <<< "$out"
          if [ "${#built[@]}" -gt 0 ]; then
            nix --extra-experimental-features nix-command copy --to "file://$HOME/fws-prebuilt/${{ matrix.group }}?compression=zstd" "${built[@]}"
            echo "kept=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v5
        if: (failure() || cancelled()) && steps.partial.outputs.kept == 'true'
        timeout-minutes: 5
        with:
          path: ~/fws-prebuilt/${{ matrix.group }}
          key: ${{ steps.drv.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        with:
          name: prebuilt-${{ matrix.group }}
          path: ~/fws-prebuilt/${{ matrix.group }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The catalog's image archives, kept in the Actions cache under a hash of
  # every file their build reads (scripts/build-images.sh --inputs). A
  # macOS runner takes from twenty minutes to an hour to build them, so a
  # run builds them only when one of those files changes.
  #
  # It waits for the unit tests: a change they fail spends no hour of
  # image building and end-to-end testing.
  images:
    needs: [prebuilt, macos, linux]
    runs-on: macos-15
    # A change to the catalog's inputs realises every package before
    # fws-mkimage keeps the unchanged archives: from an hour to past two on
    # a slow day, as on 2026-11-23.
    timeout-minutes: 180
    # actions: write lets it drop the cache entries its build supersedes.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Off: Go's caches, near 1.4 GB, would crowd the catalog's out of
          # the repository's 10 GB, and Go builds the module in minutes.
          cache: false
      - name: the archives' inputs
        id: key
        run: |
          scripts/build-images.sh --inputs > "$RUNNER_TEMP/inputs"
          echo "key=images-$(xargs shasum -a 256 < "$RUNNER_TEMP/inputs" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The archives a run with the same inputs built: the cache keeps them
      # between runs, and this run's jobs take them from its artifact below.
      - uses: actions/cache/restore@v5
        id: images
        with:
          path: ~/fws-images
          key: ${{ steps.key.outputs.key }}
      - uses: cachix/install-nix-action@v31
        if: steps.images.outputs.cache-hit != 'true'
        with:
          extra_nix_config: trusted-users = root runner
      # What the prebuilt jobs built, each group a binary cache of its own.
      - uses: actions/download-artifact@v7
        if: steps.images.outputs.cache-hit != 'true'
        with:
          pattern: prebuilt-*
          path: ~/fws-prebuilt
      # The images, their archives and a registry's copies fill the
      # runner's disk; the runner's SDKs for other platforms take tens of
      # gigabytes the build never uses.
      - name: free disk space
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/.ghcup /usr/local/lib/android \
            /Library/Developer/CoreSimulator/Caches ~/Library/Developer/CoreSimulator/Caches
          xcrun simctl delete all || true
          df -h /
      # The newest earlier catalog, whose archives fws-mkimage keeps where
      # they were made from the same inputs: a change to one image rebuilds
      # that one.
      - uses: actions/cache/restore@v5
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: ~/fws-images
          key: ${{ steps.key.outputs.key }}
          restore-keys: images-
      - name: build images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          substituters=""
          for d in ~/fws-prebuilt/prebuilt-*; do
            substituters="$substituters file://$d?trusted=1"
          done
          export NIX_CONFIG="extra-substituters = $substituters"
          scripts/build-images.sh ~/fws-images
      - name: free what the build left
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/fws-prebuilt
          nix-store --gc
          df -h /
      # crane's registry keeps every blob in memory, so it stops once it
      # has shown the archives publish.
      - name: publish images to a local registry
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          crane="$RUNNER_TEMP/bin/crane"
          "$crane" registry serve --address 127.0.0.1:5000 &
          registry=$!
          trap 'kill $registry' EXIT
          until curl -sf 127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done
          scripts/publish-images.sh ~/fws-images 127.0.0.1:5000/e6qu
          # Every tag of the catalog (internal/catalog) published, as a
          # darwin image.
          go run ./cmd/fws catalog -published | while read -r _ ref; do
            "$crane" config "127.0.0.1:5000/e6qu/${ref#ghcr.io/e6qu/}" | grep -q '"os":"darwin"' || { echo "$ref: not published as a darwin image" >&2; exit 1; }
          done
      # The catalog this run built supersedes earlier runs', which are
      # dropped before it is saved: the repository holds 10 GB of cache,
      # and a second catalog beside the first would evict the prebuilt
      # groups. The built- entries are an older layout's.
      - name: drop the entries this build supersedes
        if: steps.images.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.key.outputs.key }}
        run: |
          for prefix in images- built-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --limit 100 --json key --jq '.[].key'
          done | sort -u | while read -r k; do
            if [ "$k" != "$KEEP" ]; then
              gh cache delete --repo "$GITHUB_REPOSITORY" "$k" || true
            fi
          done
      - uses: actions/cache/save@v5
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: ~/fws-images
          key: ${{ steps.key.outputs.key }}
      # What the repository's 10 GB of cache holds, largest first: a run
      # that finds a prebuilt group or the catalog evicted shows why.
      - name: the repository's cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --sort size_in_bytes --json key,ref,sizeInBytes \
            --jq '.[] | "\(.sizeInBytes / 1048576 | floor) MiB  \(.ref)  \(.key)"'
      # The run's own copy for its e2e and publish jobs: an artifact of the
      # run, which another run's cache cannot evict, as it can the cache
      # entry, past the repository's 10 GB.
      - uses: actions/upload-artifact@v6
        with:
          name: fws-images
          path: ~/fws-images
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  # The end-to-end suite in four shards, each on a runner of its own,
  # balanced by the tests' durations in an earlier run
  # (scripts/e2e-shard.sh, tests/e2e/durations.txt).
  e2e:
    needs: images
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Off: Go's caches, near 1.4 GB, would crowd the catalog's out of
          # the repository's 10 GB, and Go builds the module in minutes.
          cache: false
      - uses: actions/download-artifact@v7
        with:
          name: fws-images
          path: ~/fws-images
      - name: install the Docker CLI, Docker Compose and buildx
        run: |
          brew install docker docker-compose docker-buildx podman podman-compose cri-tools
          mkdir -p ~/.docker
          echo "{\"cliPluginsExtraDirs\": [\"$(brew --prefix)/lib/docker/cli-plugins\"]}" > ~/.docker/config.json
          docker buildx version
      # The Dev Containers CLI, which the suite drives against the engine.
      - name: install the Dev Containers CLI
        run: |
          npm install -g @devcontainers/cli@0.90.0
          devcontainer --version
      # A runner that dies takes its job's log with it. The suite runs in
      # the background, and each snapshot keeps its output so far and the
      # runner's memory, disk and busiest processes as an artifact.
      - name: start the end-to-end tests
        working-directory: tests/e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          export FWS_E2E_IMAGES=~/fws-images
          FWS_E2E_RUN=$(../../scripts/e2e-shard.sh 4 "${{ matrix.shard }}")
          export FWS_E2E_RUN
          # The quoted scripts expand their variables in sh, not here.
          # shellcheck disable=SC2016
          nohup sh -c 'go test -tags e2e -v -count=1 -timeout 75m -run "$FWS_E2E_RUN" ./...; echo $? > "$RUNNER_TEMP/e2e/exit"' \
            > "$RUNNER_TEMP/e2e/test.log" 2>&1 < /dev/null &
          # shellcheck disable=SC2016
          nohup sh -c 'while [ ! -e "$RUNNER_TEMP/e2e/exit" ]; do
              date; df -h /; sysctl vm.swapusage kern.memorystatus_level; vm_stat
              ps -o pid,ppid,pgid,stat,rss,%cpu,etime,comm -p "$(pgrep -d, -f "Runner\.|provjobd")"
              ps -axro pid,ppid,pgid,stat,rss,%cpu,etime,comm | head -25; sleep 15
            done' > "$RUNNER_TEMP/e2e/samples.log" 2>&1 < /dev/null &
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-01
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-02
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-03
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-04
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-05
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-06
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-07
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-08
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-09
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-10
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-11
      - uses: ./.github/actions/e2e-snapshot
        with:
          name: e2e-${{ matrix.shard }}-12
      - name: end-to-end tests
        run: |
          cat "$RUNNER_TEMP/e2e/test.log"
          [ -e "$RUNNER_TEMP/e2e/exit" ] || { echo "the suite is still running"; exit 1; }
          exit "$(cat "$RUNNER_TEMP/e2e/exit")"
      - name: crash reports and Seatbelt denials
        if: failure()
        run: |
          df -h /
          vm_stat
          # Each crash report's reason, where an uncaught exception was
          # thrown, the faulting thread and every distinct thread stack.
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import collections, json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          r = json.loads(body)
          def frames(fs):
              return [x.get("symbol", "?") for x in fs]
          print(json.dumps({k: r.get(k) for k in ("procPath", "parentProc", "exception", "asi", "termination")}))
          if "lastExceptionBacktrace" in r:
              print("thrown at:")
              for s in frames(r["lastExceptionBacktrace"])[:30]:
                  print("   ", s)
          threads = r.get("threads", [])
          ft = r.get("faultingThread")
          if ft is not None and ft < len(threads):
              print("faulting thread", ft, ":")
              for s in frames(threads[ft].get("frames", []))[:30]:
                  print("   ", s)
          stacks = collections.Counter(" <- ".join(frames(t.get("frames", []))[:12]) for t in threads)
          print(len(threads), "threads")
          for s, n in stacks.most_common(15):
              print(n, s)
          PY
          done
          # Each distinct denial once, by process, from the suite's last
          # minutes: reading hours of the unified log starves the runner
          # until it loses its connection, and the job's log with it.
          perl -e 'alarm 120; exec @ARGV' log show --last 20m --style compact --predicate 'sender == "Sandbox"' |
            sed -n 's/.*Sandbox: \([^(]*\)([0-9]*) \(deny.*\)/\1 \2/p' | sort | uniq -c | sort -rn

  # The images main's tests passed, on GitHub's container registry as
  # ghcr.io/<owner>/fws-<name>:<tag>, which the engine pulls from.
  publish:
    needs: [images, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Off: Go's caches, near 1.4 GB, would crowd the catalog's out of
          # the repository's 10 GB, and Go builds the module in minutes.
          cache: false
      - uses: actions/download-artifact@v7
        with:
          name: fws-images
          path: ~/fws-images
      - name: log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$TOKEN" | "$RUNNER_TEMP/bin/crane" auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: publish images to ghcr.io
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          scripts/publish-images.sh ~/fws-images "ghcr.io/$owner"
