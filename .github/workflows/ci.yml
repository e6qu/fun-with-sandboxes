name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (darwin)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet -tags e2e ./tests/e2e
      - name: cross-build
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: portable unit tests
        run: go test ./...

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go test -v -count=1 ./...

  e2e:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@v31
      - name: install the Docker CLI and Docker Compose
        run: brew install docker docker-compose
      - name: build images
        run: scripts/build-images.sh "$RUNNER_TEMP/images"
      - name: end-to-end tests
        env:
          FWS_E2E_IMAGES: ${{ runner.temp }}/images
        run: go test -tags e2e -v -count=1 -timeout 30m ./tests/e2e
