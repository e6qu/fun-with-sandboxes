name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on a branch by hand when GitHub drops a pull request's event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: cross-build
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - name: vet (darwin)
        run: |
          GOOS=darwin GOARCH=arm64 scripts/vet.sh
          GOOS=darwin GOARCH=amd64 scripts/vet.sh
          (cd tests/e2e && GOOS=darwin GOARCH=arm64 go vet -tags e2e ./...)
      - name: portable unit tests
        run: go test -race -count=3 ./...
      - name: third_party/buildkit matches its sync script
        run: |
          scripts/sync-buildkit.sh
          git diff --exit-code -- third_party/buildkit
          test -z "$(git status --porcelain -- third_party/buildkit)"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each test runs three times under the race detector, so a test that
      # passes only sometimes, or races, fails here.
      - name: unit tests
        run: go test -race -count=3 ./...

  # Nix builds MySQL and MariaDB from source, with their vendors'
  # compilation comment (images/servers.nix), which no binary cache holds.
  # Each server's build is kept in the Actions cache, keyed by its
  # derivation, so it is built again only when it changes.
  servers:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        server: [mysql, mariadb]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A sandboxed build, as Hydra's: MySQL's CMake otherwise takes
      # OpenSSL from the runner's Homebrew.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-users = root runner
            sandbox = true
      - name: derivation
        id: drv
        run: echo "key=server-${{ matrix.server }}-$(scripts/build-images.sh --server-derivations ${{ matrix.server }} | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/fws-servers/${{ matrix.server }}
          key: ${{ steps.drv.outputs.key }}
          lookup-only: true
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          paths=$(scripts/build-images.sh --servers ${{ matrix.server }})
          nix --extra-experimental-features nix-command copy --to "file://$HOME/fws-servers/${{ matrix.server }}" $paths
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/fws-servers/${{ matrix.server }}
          key: ${{ steps.drv.outputs.key }}

  e2e:
    needs: servers
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: trusted-users = root runner
      - name: database server derivations
        id: drv
        run: |
          for s in mysql mariadb; do
            echo "$s=server-$s-$(scripts/build-images.sh --server-derivations $s | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/cache/restore@v4
        with:
          path: ~/fws-servers/mysql
          key: ${{ steps.drv.outputs.mysql }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/fws-servers/mariadb
          key: ${{ steps.drv.outputs.mariadb }}
          fail-on-cache-miss: true
      # The images, their archives, a registry's copies and the engines'
      # stores fill the runner's disk; the runner's SDKs for other
      # platforms take tens of gigabytes the suite never uses.
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/.ghcup /usr/local/lib/android \
            /Library/Developer/CoreSimulator/Caches ~/Library/Developer/CoreSimulator/Caches
          xcrun simctl delete all || true
          df -h /
      - name: install the Docker CLI, Docker Compose and buildx
        run: |
          brew install docker docker-compose docker-buildx podman podman-compose
          mkdir -p ~/.docker
          echo "{\"cliPluginsExtraDirs\": [\"$(brew --prefix)/lib/docker/cli-plugins\"]}" > ~/.docker/config.json
          docker buildx version
      # The files the images pin from GitHub releases and repositories,
      # kept between runs so a build needs GitHub only when a pin changes.
      - uses: actions/cache/restore@v4
        id: fetched
        with:
          path: ~/fws-fetched
          key: fetched-${{ hashFiles('images/**/*.nix') }}
      - name: build images
        run: |
          substituters="file://$HOME/fws-servers/mysql?trusted=1 file://$HOME/fws-servers/mariadb?trusted=1"
          # The daemon, as root, would claim an empty cache directory that
          # the next step fills as the runner.
          if [ "${{ steps.fetched.outputs.cache-hit }}" = true ]; then
            substituters="$substituters file://$HOME/fws-fetched?trusted=1"
          fi
          export NIX_CONFIG="extra-substituters = $substituters"
          scripts/build-images.sh "$RUNNER_TEMP/images"
      - name: keep the pinned downloads
        if: steps.fetched.outputs.cache-hit != 'true'
        run: |
          nixpkgs=$(sed -n 's/^nixpkgs=${NIXPKGS:-\(.*\)}$/\1/p' scripts/build-images.sh)
          for f in images/*/*.nix; do
            nix --extra-experimental-features 'nix-command flakes' build --no-link --print-out-paths --impure -f "$f" --argstr nixpkgs "$nixpkgs"
          done | xargs nix --extra-experimental-features nix-command copy --to "file://$HOME/fws-fetched"
      - uses: actions/cache/save@v4
        if: steps.fetched.outputs.cache-hit != 'true'
        with:
          path: ~/fws-fetched
          key: ${{ steps.fetched.outputs.cache-primary-key }}
      - name: publish images to a local registry
        run: |
          crane="go run github.com/google/go-containerregistry/cmd/crane@v0.22.1"
          $crane registry serve --address 127.0.0.1:5000 &
          until curl -sf 127.0.0.1:5000/v2/ >/dev/null; do sleep 1; done
          scripts/publish-images.sh "$RUNNER_TEMP/images" 127.0.0.1:5000/e6qu
          for ref in fws-postgres:16 fws-postgres:18 fws-redis:8 fws-nginx:1 fws-mariadb:11 fws-python:3.14 fws-node:26 fws-bun:1 fws-gitea:1 fws-dynamodb-local:2 fws-rabbitmq:4 fws-lambda/python:3.14 fws-lambda/nodejs:24 fws-lambda/java:17 fws-playwright:1.59 fws-toolbox:1 fws-ryuk:0.14.0 fws-mysql:8.4 fws-valkey:9 fws-memcached:1.6 fws-nats:2.14 fws-seaweedfs:4.36 fws-etcd:3.6 fws-consul:2.1 fws-vault:2.0 fws-mongo:8.2 fws-kafka:4.2 fws-mailpit:1.32 fws-meilisearch:1.43 fws-qdrant:1.17 fws-neo4j:2026.02 fws-clickhouse:26.5 fws-influxdb:2.7 fws-opensearch:3.5 fws-toxiproxy:2.12 fws-dind:29; do
            $crane config "127.0.0.1:5000/e6qu/$ref" | grep -q '"os":"darwin"'
          done
      - name: end-to-end tests
        env:
          FWS_E2E_IMAGES: ${{ runner.temp }}/images
        working-directory: tests/e2e
        run: go test -tags e2e -v -count=1 -timeout 90m ./...
      - name: crash reports and Seatbelt denials
        if: failure()
        run: |
          df -h /
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "== $f"
            head -c 20000 "$f"
            echo
          done
          # Each distinct denial once, by process.
          log show --last 2h --style compact --predicate 'sender == "Sandbox"' |
            sed -n 's/.*Sandbox: \([^(]*\)([0-9]*) \(deny.*\)/\1 \2/p' | sort | uniq -c | sort -rn
