name: end-to-end snapshot
description: >
  Waits for the end-to-end suite to finish, for four minutes at most, and
  keeps its output so far and the runner's resource samples as an artifact,
  which outlives a runner that then dies.
inputs:
  name:
    description: the artifact's name
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for _ in $(seq 240); do
          [ -e "$RUNNER_TEMP/e2e/exit" ] && break
          sleep 1
        done
        # The job's log keeps each test's result and what a failing test
        # reported, as far as the suite has come, for a job cancelled or
        # timed out before its last step prints the whole output.
        log="$RUNNER_TEMP/e2e/test.log" seen="$RUNNER_TEMP/e2e/printed"
        from=$(( $(cat "$seen" 2>/dev/null || echo 0) + 1 ))
        to=$(wc -l < "$log" 2>/dev/null || echo 0)
        if [ "$to" -ge "$from" ]; then
          sed -n "${from},${to}p" "$log" | grep -E '^(--- |    --- |ok |FAIL|panic:)|^        |^    [A-Za-z0-9_]+\.go:[0-9]+:' || true
          echo "$to" > "$seen"
        fi
        tail -n 3 "$log" || true
    # A snapshot is for reading after a runner dies: one that cannot be
    # kept, as when the artifact service does not resolve for a moment,
    # leaves the suite running and the next snapshot to keep its output.
    - uses: actions/upload-artifact@v6
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/e2e
        retention-days: 7
